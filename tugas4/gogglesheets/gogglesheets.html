<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Sederhana</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background: #007bff;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
        }

        .frame-box {
            background: white;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        iframe {
            width: 100%;
            height: 500px;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h2>Laporan Data</h2>
            <a href="https://docs.google.com/spreadsheets/d/ID_SHEET_ANDA/edit" target="_blank" class="btn">Buka Google Sheets</a>
        </header>

        <div class="frame-box">
            <!-- Ganti URL di bawah dengan link Embed (Publish to Web) -->
            <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTrJ8glRZ59BuyGBdl-gNOm-kCYDxkzTjt2R2ntI0RqZFq0KZ2lAbP4RLO6Ww_FwwRYzw5jbulNmytI/pubhtml?gid=0&single=true"></iframe>
        </div>
    </div>

</body>
</html>
